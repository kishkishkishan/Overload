<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Overload</title>
<meta name="description" content="Gym log with programme, check-in, machine swaps, body map, cardio, sauna, weigh-ins and progress photos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Overload">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E9ECEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1011" media="(prefers-color-scheme: dark)">
<link rel="preload" href="fonts/instrument-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Big Shoulders Display";font-weight:700;font-display:swap;src:url(fonts/big-shoulders-display-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-weight:800;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:400;font-display:swap;src:url(fonts/instrument-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:500;font-display:swap;src:url(fonts/instrument-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:600;font-display:swap;src:url(fonts/instrument-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-weight:700;font-display:swap;src:url(fonts/instrument-sans-latin-700-normal.woff2) format("woff2")}
/* Layout: phone-first app shell. Sticky header, one scrolling view, fixed bottom tab bar.
   Palette borrows Olympic plate colours (red 25 / blue 20 / yellow 15 / green 10) for state. */
:root{
  --bg:#E9ECEA; --surface:#FFFFFF; --surface2:#F3F5F3; --ink:#121617; --muted:#5C6664; --line:#D3D8D5;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --accent-soft:#E2E9FB;
  --red:#D3263C; --yellow:#E2A90A; --green:#24945A; --blue:#2A57C9;
  --body:#D6DBD8; --ghost:#9AA3A0;
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1011; --surface:#161A1B; --surface2:#1D2223; --ink:#ECF0EE; --muted:#97A19E; --line:#2A3133;
  --accent:#7290FF; --accent-ink:#0D1011; --accent-soft:#1E2742;
  --red:#F2566A; --yellow:#F3C643; --green:#46C486; --blue:#7290FF;
  --body:#2A3133; --ghost:#5E6866; color-scheme:dark;}
  html{color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1011; --surface:#161A1B; --surface2:#1D2223; --ink:#ECF0EE; --muted:#97A19E; --line:#2A3133;
  --accent:#7290FF; --accent-ink:#0D1011; --accent-soft:#1E2742;
  --red:#F2566A; --yellow:#F3C643; --green:#46C486; --blue:#7290FF;
  --body:#2A3133; --ghost:#5E6866; color-scheme:dark;}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{overscroll-behavior-y:none}
.inwk header.top{display:none}
.inwk .wkhead{top:env(safe-area-inset-top,0px)}
.exname{font-size:17px!important}
.swapbtn{color:var(--accent);background:var(--accent-soft)}
.eqchip{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.altrow{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--surface);width:100%;text-align:left;font-weight:400}
.altrow .t{font-weight:700}
.altrow.top{outline:2px solid var(--accent)}
.offchips{display:flex;flex-wrap:wrap;gap:6px}
.offchips button{font-size:13px;padding:7px 11px;border-radius:99px;font-weight:600;color:var(--muted);background:var(--surface2)}
.offchips button.on{background:var(--red);color:#fff;text-decoration:line-through}
.swapnote{font-size:12px;color:var(--accent);font-weight:600}

body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:12px 10px}
.brand{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand small{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted);margin-left:8px;vertical-align:middle}
main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:14px;padding-block:4px 0}
h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h3{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h4{font-size:16px;margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrapr{flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:8px}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:11px;padding:11px 14px;background:var(--surface2);color:var(--ink);cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;padding:8px 10px;color:var(--accent)}
button.danger{background:transparent;color:var(--red)}
button.sm{padding:7px 11px;font-size:13px;border-radius:9px}
button.wide{width:100%}
button:disabled{opacity:.45}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.red{color:var(--red)} .chip.green{color:var(--green)} .chip.yellow{color:var(--yellow)}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;font-size:13px;background:transparent;border-radius:9px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0;background:none;border-radius:0;text-align:left;width:100%;font-weight:400}
.li:first-child{border-top:0}
.li .t{font-weight:600}
.due{border-left:0;background:var(--accent-soft)}
.due h4{color:var(--accent)}
.statstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:10px 10px 9px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.stat span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.upnext{border:2px solid var(--accent)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
/* workout */
.wkhead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:10;background:var(--bg);padding-block:4px 8px;display:flex;flex-direction:column;gap:8px}
.budget{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.budget i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.budget.over i{background:var(--red)}
.ex .exname{font-weight:700;font-size:16px;background:none;padding:0;text-align:left;color:var(--ink)}
.ss-tag{font-family:var(--display);font-weight:800;font-size:15px;background:var(--ink);color:var(--surface);border-radius:6px;padding:1px 7px}
.ex.ss{box-shadow:inset 4px 0 0 var(--accent)}
.target{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;background:var(--surface2);border-radius:10px;padding:8px 10px}
.target b{font-variant-numeric:tabular-nums}
.sets{display:grid;grid-template-columns:38px 1fr 1fr 46px;gap:8px;align-items:center}
.sets .hd{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.sets input{text-align:center;font-size:18px;font-weight:600;padding:9px 4px;font-variant-numeric:tabular-nums}
.sets input::placeholder{color:var(--ghost);font-weight:500}
.stype{padding:8px 0;font-family:var(--display);font-size:18px;font-weight:800;border-radius:9px;background:var(--surface2)}
.stype.W{color:var(--yellow)} .stype.D{color:var(--red)}
.tick{padding:8px 0;border-radius:9px;background:var(--surface2);color:var(--muted);display:grid;place-items:center}
.tick.on{background:var(--green);color:#fff}
.setrow.done input{background:transparent;border-color:transparent}
.restbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:25}
.restbar .wrap{padding-block:0}
.restbar .in{background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.restbar b{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.restbar button{background:rgba(127,127,127,.25);color:inherit}
/* body map */
.bodymap{width:100%;max-width:420px;margin:0 auto;display:block}
.bodymap .mus *{fill:var(--f);stroke:var(--surface);stroke-width:1.5;cursor:pointer;transition:fill .3s}
.bodymap .neu *{fill:var(--body);stroke:var(--surface);stroke-width:1.5}
.bodymap text{fill:var(--muted);font:700 11px var(--sans);letter-spacing:.1em}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mbar{height:8px;border-radius:99px;background:var(--surface2);position:relative;overflow:hidden}
.mbar .band{position:absolute;top:0;bottom:0;background:var(--line);opacity:.8}
.mbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.lvl{font-family:var(--display);font-weight:800;font-size:18px;min-width:40px;text-align:right}
/* charts */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:500 10px var(--sans)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ln2{fill:none;stroke:var(--ghost);stroke-width:1.5;stroke-dasharray:3 4}
.chart .dt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .dt.last{fill:var(--accent)}
.chart .ar{fill:var(--accent);opacity:.1}
.chart .bar{fill:var(--accent)} .chart .bar.lo{fill:var(--line)}
.chart .tgt{stroke:var(--green);stroke-width:1.5;stroke-dasharray:4 3}
/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--surface2);border-radius:12px;padding:10px;text-align:center;min-width:0}
.badge .ic{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;color:var(--ghost)}
.badge.got .ic{color:var(--yellow)}
.badge div{font-size:12px;font-weight:600;margin-top:4px}
.badge.got{background:var(--accent-soft)}
/* photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pgrid button{padding:0;border-radius:10px;overflow:hidden;position:relative;aspect-ratio:3/4;background:var(--surface2);max-width:100%}
.pgrid img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid .cap{position:absolute;left:0;right:0;bottom:0;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));padding:12px 6px 4px;text-align:left}
.pgrid button.sel{outline:3px solid var(--accent);outline-offset:-3px}
.cmp{position:relative;width:100%;max-width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--surface2)}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .div{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.cmp .lab{position:absolute;top:8px;font-size:12px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);border-radius:6px;padding:2px 7px}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--accent)}
/* coach */
.md{display:flex;flex-direction:column;gap:8px;font-size:15px}
.md ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.md h4{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.msg{padding:10px 12px;border-radius:12px;background:var(--surface2);max-width:92%}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.call{display:flex;gap:10px;align-items:flex-start}
.call .dot{width:10px;height:10px;border-radius:3px;margin-top:6px;flex:none}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-block:6px}
nav.tabs button{background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);font-weight:600}
nav.tabs button.on{color:var(--accent)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,8,9,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .wrap{display:flex;flex-direction:column;gap:14px;padding-block:16px 0}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0}
.stickyfoot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));margin-inline:-2px;z-index:2}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:60;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.picker{max-height:50dvh;overflow:auto}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchips button{font-size:13px;padding:6px 10px;border-radius:99px;font-weight:600;color:var(--muted)}
.mchips button.p1{background:var(--accent);color:var(--accent-ink)}
.mchips button.p5{background:var(--accent-soft);color:var(--accent)}
.confirm{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--red)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.statstrip{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">Overload<small id="tabname">TRAIN</small></div>
  <button class="sm" data-act="settings" aria-label="Settings">Settings</button>
</div></header>
<main><div class="wrap" id="view"><div class="card empty"><p>Loading your log…</p></div></div></main>
<div class="restbar" id="restbar" hidden><div class="wrap"><div class="in"><span class="small">Rest</span><b id="restt">1:30</b><span class="grow"></span><button class="sm" data-act="restadd">+30s</button><button class="sm" data-act="restskip">Skip</button></div></div></div>
<nav class="tabs"><div class="wrap">
  <button data-act="tab" data-t="train"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Train</button>
  <button data-act="tab" data-t="body"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="2.5"/><path d="M12 8v7M7 10.5h10M12 15l-3 6M12 15l3 6"/></svg>Body</button>
  <button data-act="tab" data-t="progress"><svg viewBox="0 0 24 24"><path d="M4 4v16h16M8 15l4-4 3 3 5-6"/></svg>Progress</button>
  <button data-act="tab" data-t="photos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8.5 6 10 4h4l1.5 2"/></svg>Photos</button>
  <button data-act="tab" data-t="coach"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H10l-6 4z"/><path d="M8 9h8M8 12h5"/></svg>Coach</button>
</div></nav>
<div id="sheetroot"></div>
<input type="file" id="photoin" accept="image/*" hidden>
<input type="file" id="importin" hidden>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
// ================= constants =================
const DAY=864e5;
const MUS={chest:['Chest',10,20],frontDelts:['Front delts',4,12],sideDelts:['Side delts',8,16],rearDelts:['Rear delts',6,14],traps:['Traps',4,12],lats:['Lats',10,20],upperBack:['Upper back',8,16],lowerBack:['Lower back',2,8],biceps:['Biceps',8,16],triceps:['Triceps',8,16],forearms:['Forearms',2,10],abs:['Abs',4,12],obliques:['Obliques',2,8],quads:['Quads',10,20],hamstrings:['Hamstrings',8,16],glutes:['Glutes',6,16],calves:['Calves',6,14],adductors:['Adductors',2,8]};
const MAJOR=['chest','lats','upperBack','sideDelts','quads','hamstrings','biceps','triceps'];
const LIB={
 chest_press_machine:{n:'Chest press machine',m:{chest:1,frontDelts:.5,triceps:.5},k:'c'},
 incline_db_press:{n:'Incline dumbbell press',m:{chest:1,frontDelts:.6,triceps:.4},k:'c'},
 db_press:{n:'Dumbbell press',m:{chest:1,frontDelts:.5,triceps:.5},k:'c'},
 bench_press:{n:'Barbell bench press',m:{chest:1,frontDelts:.5,triceps:.6},k:'c'},
 chest_fly_machine:{n:'Chest fly machine',m:{chest:1},k:'i'},
 db_fly:{n:'Dumbbell flies',m:{chest:1,frontDelts:.3},k:'i'},
 dips:{n:'Dips',m:{chest:.8,triceps:1,frontDelts:.4},k:'c'},
 military_press:{n:'Military press',m:{frontDelts:1,sideDelts:.4,triceps:.5},k:'c'},
 shoulder_press_machine:{n:'Shoulder press machine',m:{frontDelts:1,sideDelts:.4,triceps:.5},k:'c'},
 egyptian_lateral:{n:'Egyptian lateral raise',m:{sideDelts:1},k:'i'},
 db_lateral:{n:'Dumbbell lateral raise',m:{sideDelts:1},k:'i'},
 front_raise:{n:'Front shoulder raise',m:{frontDelts:1},k:'i'},
 y_raise:{n:'Y raise',m:{sideDelts:.6,traps:.5,rearDelts:.4},k:'i'},
 tricep_pushdown:{n:'Tricep pushdown',m:{triceps:1},k:'i'},
 oh_tricep_ext:{n:'Overhead tricep extension',m:{triceps:1},k:'i'},
 chest_supported_row:{n:'Chest supported row',m:{upperBack:1,lats:.6,rearDelts:.4,biceps:.4},k:'c'},
 seated_cable_row:{n:'Seated cable row',m:{upperBack:1,lats:.6,biceps:.4},k:'c'},

  while(estMin(out)>budget&&guard++<60){let j=-1;for(let i=out.length-1;i>=0;i--)if(ex(out[i].exId).k==='i'&&out[i].sets>2){j=i;break}
    if(j<0)for(let i=out.length-1;i>=0;i--)if(out[i].sets>2){j=i;break}
    if(j>=0){out[j].sets--;continue}
    let k=-1;for(let i=out.length-1;i>=0;i--)if(ex(out[i].exId).k==='i'){k=i;break}
    if(k<0&&out.length>2)k=out.length-1; if(k<0)break; out.splice(k,1)}
  return out}
const readiness=r=>r?(r.sleep+(6-r.stress)+r.energy+(6-(r.sore??3)))/4:3;

// ================= swap engine =================
const eqOf=X=>X.eq||'machine';
function cosM(a,b){let d=0,na=0,nb=0;for(const k of new Set([...Object.keys(a||{}),...Object.keys(b||{})])){const x=(a||{})[k]||0,y=(b||{})[k]||0;d+=x*y;na+=x*x;nb+=y*y}return na&&nb?d/Math.sqrt(na*nb):0}
const isUnavail=id=>(cfg().unavail||[]).includes(id);
function swapOptions(id,off=[],exclude=[]){const X=ex(id),lib=allEx(),out=[];
  for(const[cid,C]of Object.entries(lib)){if(cid===id||exclude.includes(cid)||off.includes(eqOf(C))||isUnavail(cid))continue;
    const sim=cosM(X.m,C.m),same=!!(X.p&&C.p===X.p);if(sim<.55&&!same)continue;
    out.push({id:cid,sim,same,sc:sim+(same?.6:0)+(X.k===C.k?.1:0)+((A().hist[cid]||[]).length?.08:0)})}
  return out.sort((a,b)=>b.sc-a.sc)}
function swapLabel(o){return o.same?'Same movement':`${Math.round(o.sim*100)}% muscle match`}
let swp=null;
function openSwap(ctx){swp={...ctx,off:[...(ctx.off||[])],never:false};openSheet(sheetSwap)}
function sheetSwap(){const X=ex(swp.exId),gymNo=cfg().gymNo||[],off=[...new Set([...gymNo,...swp.off])],opts=swapOptions(swp.exId,off,swp.exclude||[]).slice(0,7);
  return `<h2>Swap ${esc(X.n)}</h2>
  <div class="stack"><span class="small" style="font-weight:600;color:var(--muted)">Busy or missing right now (tap to rule out)</span>
  <div class="offchips">${Object.entries(EQ).map(([k,l])=>gymNo.includes(k)?'':`<button class="${swp.off.includes(k)?'on':''}" data-act="swapoff" data-k="${k}">${l}</button>`).join('')}</div></div>
  <div class="stack">${opts.length?opts.map((o,n)=>{const C=ex(o.id),lp=lastPerf(o.id);return `<button class="altrow ${n===0?'top':''}" data-act="swapto" data-id="${o.id}"><div class="grow"><div class="t">${esc(C.n)}</div><div class="small muted">${swapLabel(o)} · <span class="eqchip">${EQ[eqOf(C)]||''}</span>${lp?` · last ${lp.w}×${lp.r}`:''}</div></div><span class="chip ${n===0?'acc':''}">${n===0?'Best':'Use'}</span></button>`}).join(''):'<p class="muted small">Nothing close enough with that kit ruled out. Untick something above, or pick any exercise below.</p>'}</div>
  <button class="${swp.never?'primary':''}" data-act="swapnever">${swp.never?'✓ ':''}Not at my gym: never suggest ${esc(X.n)}</button>
  <button class="ghost" data-act="swapany">Pick any exercise instead</button>`}
async function applySwap(newId){const c=swp;if(c.never&&!isUnavail(c.exId)){await put('settings','main',{...cfg(),unavail:[...(cfg().unavail||[]),c.exId]},true)}
  if(c.kind==='live'){const a=S.active.current,it=a.items[c.i],done=it.sets.filter(s=>s.done),left=it.sets.filter(s=>!s.done).length;
    if(done.length){it.sets=done;a.items.splice(c.i+1,0,{exId:newId,group:it.group,from:it.exId,sets:Array.from({length:Math.max(1,left)},()=>({w:'',r:'',t:'N',done:false}))})}
    else{it.from=it.from||it.exId;it.exId=newId;it.sets.forEach(s=>{s.w='';s.r=''})}
    saveActive();swp=null;closeSheet();render(true);toast(`Swapped to ${ex(newId).n}.`)}
  else if(c.kind==='plan'){draft.repl[c.exId]=newId;swp=null;openSheet(sheetStart)}}

const progDays=()=>routines().filter(r=>r.prog&&!r.archived);

function nextRoutine(){const R=rotation();if(!R.length)return null;const last=A().W.find(w=>w.routineId&&R.some(r=>r.id===w.routineId));
  if(!last)return R[0].id;const i=R.findIndex(r=>r.id===last.routineId);return R[(i+1)%R.length].id}
function programmeCard(){const p=phase(),wb=weeksBack(),nx=nextRoutine(),R=progDays(),ro=rebuildOverall(),reg=A().regained.length;
  if(!R.length)return `<div class="card upnext"><h2>Structured programme</h2><p class="small muted">A 3-day Push/Pull/Legs A/B rotation that ramps volume over 4 weeks, then runs 3-week build blocks with a deload. Coming back after a break? Targets start from a safe share of your old numbers.</p><button class="primary" data-act="setupprog">Set up programme</button></div>`;

   <h2>Up next: ${esc(S.routines[nx]?.name||'—')}</h2>${p?`<p class="small muted">${esc(p.note)}</p>`:''}
   ${cells?`<div class="row" style="gap:4px;align-items:flex-start">${cells}</div>`:''}
   <button class="primary wide" data-act="checkin">Check in and build today's session</button>
   <button class="wide" data-act="quickstart">Quick start ${esc(S.routines[nx]?.name||'')} (skip check-in)</button>

function dueCards(){const c=cfg(),out=[];const wi=weighins(),lastW=wi.length?wi[wi.length-1].date:0;
  if(Date.now()-lastW>6*DAY)out.push(`<div class="card due"><div class="row spread"><div><h4>Weigh-in due</h4><p class="small muted">${lastW?'Last one '+ago(lastW):'Log a starting weight'}. Same time, same conditions each week.</p></div><button class="primary sm" data-act="weighin">Log</button></div></div>`);
  const ph=photos(),lastP=ph.length?ph[0].date:0;
  if(Date.now()-lastP>c.photoEvery*DAY)out.push(`<div class="card due"><div class="row spread"><div><h4>Progress photos due</h4><p class="small muted">${lastP?'Last set '+ago(lastP):'Take a baseline set'}: front, side, back.</p></div><button class="primary sm" data-act="tab" data-t="photos">Open</button></div></div>`);

function vTrain(){const a=S.active.current;if(a)return vWorkout(a);
  const c=cfg(),wc=weekCounts(1)[0],R=routines().filter(r=>!r.archived),nx=nextRoutine(),W=A().W;
  let h=`<div class="statstrip">
    <div class="stat"><b class="num">${wc}/${c.weeklyTarget}</b><span>This week</span></div>
    <div class="stat"><b class="num">${streak()}</b><span>Week streak</span></div>

    <div class="stat"><b class="num">${W.length}</b><span>Sessions</span></div></div>`;
  const lb=cfg().lastBackup||0,nb=W.length>=3&&Date.now()-lb>14*DAY?`<div class="card due"><div class="row spread"><div><h4>Back up your log</h4><p class="small muted">It lives only on this phone. ${lb?'Last backup '+ago(lb):'No backup yet'}.</p></div><button class="primary sm" data-act="export">Back up</button></div></div>`:'';
  h=saunaCard()+programmeCard()+h+dueCards()+nb+cardioCard();
  h+=`<div class="card"><div class="row spread"><h3>Routines</h3><button class="ghost sm" data-act="newroutine">+ New</button></div>`;
  if(!R.length)h+=`<div class="empty"><p>No routines yet. Load the 3-day Push/Pull/Legs A/B starter or build your own.</p><button class="primary" data-act="templates">Load PPL A/B starter</button></div>`;
  else h+='<div class="list">'+R.map(r=>{const last=W.find(w=>w.routineId===r.id);const est=estMin(r.items.map(i=>({...i})));
    return `<div class="li"><button class="grow" style="background:none;padding:0;text-align:left;font-weight:400" data-act="editroutine" data-id="${r.id}">
      <div class="row"><span class="t">${esc(r.name)}</span>${r.id===nx?'<span class="chip acc">Up next</span>':''}${r.prog?'<span class="chip">Programme</span>':''}</div>
      <div class="small muted">${r.items.length} exercises · ~${est} min · ${last?ago(last.start):'not done yet'}</div></button>
      <button class="${r.id===nx?'primary':''} sm" data-act="prestart" data-id="${r.id}">Start</button></div>`}).join('')+'</div>';
  h+=`</div><div class="grid2"><button data-act="prestart" data-id="">Empty workout</button><button data-act="checkin">Today's check-in</button></div>`;
  h+=`<div class="card"><div class="row spread"><h3>Recent sessions</h3>${W.length>5?'<button class="ghost sm" data-act="tab" data-t="progress">All</button>':''}</div>`;

  if(arch.length)h+=`<details class="card"><summary class="small muted">${arch.length} archived routine${arch.length>1?'s':''}</summary><div class="list">${arch.map(r=>`<button class="li" data-act="editroutine" data-id="${r.id}"><span class="grow">${esc(r.name)}</span><span class="small muted">Edit</span></button>`).join('')}</div></details>`;
  return h}
function histRow(w){const sets=(w.items||[]).reduce((a,it)=>a+hard(it),0);const min=w.end?Math.round((w.end-w.start)/6e4):null;
  return `<button class="li" data-act="viewwk" data-id="${w.id}"><div class="grow"><div class="t">${esc(w.name)}</div><div class="small muted">${fmtDay(w.start)} · ${(w.items||[]).length} exercises · ${sets} hard sets${min?` · ${min} min`:''}</div></div><span class="muted">›</span></button>`}

// ---------- start flow: check-in → today's session ----------
let draft=null;
function preStart(rid,auto){const c=cfg();
  draft={mode:auto?'checkin':'routine',rid:rid||null,name:'Workout',readiness:{sleep:3,stress:3,energy:3,sore:2},soreAreas:[],budget:c.budget,busy:2,note:'',fit:true,off:[],repl:{}};
  openSheet(sheetStart)}
function soreLoad(r,sm){let t=0,s=0;r.items.forEach(i=>{const m=ex(i.exId).m;for(const k in m)if(m[k]>=1){t+=i.sets;if(sm.has(k))s+=i.sets}});return t?s/t:0}
function computePlan(){const d=draft,why=[];let rid=d.rid;
  if(d.mode==='checkin'&&d.soreAreas.length&&rid){const sm=new Set(d.soreAreas.flatMap(a=>SORE[a][1])),R=rotation(),cur=S.routines[rid];
    if(cur&&soreLoad(cur,sm)>.35){const i0=R.findIndex(r=>r.id===rid);let pick=null;
      for(let k=1;k<R.length;k++){const r=R[(i0+k)%R.length];if(soreLoad(r,sm)<.2){pick=r;break}}
      const areas=d.soreAreas.map(a=>SORE[a][0].toLowerCase()).join(' and ');
      if(pick){why.push(`Swapped ${cur.name} for ${pick.name} because of soreness in your ${areas}. The rotation carries on from ${pick.name}.`);rid=pick.id}
      else why.push(`${cur.name} works sore muscles (${areas}). Keep those lifts light today.`)}}
  const r=rid?S.routines[rid]:null;let items=r?r.items.map(i=>({...i})):[];const p=phase();
  if(p&&items.length){items=items.map(i=>({...i,sets:p.k==='deload'?Math.max(1,Math.ceil(i.sets/2)):Math.min(i.sets,p.cap)}));why.push(`Week ${weeksBack()+1}, ${p.n}: ${p.note}`)}
  const sc=readiness(d.readiness);
  if(sc<2.25){items=items.slice(0,4).map(i=>({...i,sets:Math.min(2,i.sets)}));why.push(`Readiness ${sc.toFixed(1)}/5: short recovery session, light weights, nothing close to failure. A rest day is also a good call.`)}
  else if(sc<3){items=items.map(i=>({...i,sets:i.sets-(ex(i.exId).k==='i'&&i.sets>2?1:0)}));why.push(`Readiness ${sc.toFixed(1)}/5: trimmed isolation work, same weights. Leave an extra rep in reserve.`)}
  else why.push(`Readiness ${sc.toFixed(1)}/5: go for the targets.`);
  items=items.map(i=>d.repl[i.exId]?{...i,exId:d.repl[i.exId],from:i.exId,manual:true}:i);
  const off=[...new Set([...(cfg().gymNo||[]),...d.off,...(d.busy===3?['barbell']:[])])],sw=[],miss=[];
  items=items.map(i=>{if(i.manual)return i;const X=ex(i.exId);if(!off.includes(eqOf(X))&&!isUnavail(i.exId))return i;
    const alt=swapOptions(i.exId,off,items.map(x=>x.exId))[0];if(alt){sw.push(`${X.n} → ${ex(alt.id).n}`);return{...i,exId:alt.id,from:i.exId}}miss.push(X.n);return i});
  if(sw.length)why.push(`Swapped for what's free${d.busy===3?' (busy gym: racks avoided)':''}: ${sw.join('; ')}.`);
  if(miss.length)why.push(`No good swap found for ${miss.join(', ')}. Tap Swap on it to choose.`);
  if(d.fit&&items.length){const b=estMin(items);items=fitToTime(items,d.budget);if(estMin(items)<b)why.push(`Trimmed from ~${b} to fit ${d.budget} minutes (isolation sets go first).`)}
  return{rid,name:r?r.name:'Workout',items,why}}
function sheetStart(){const d=draft,r=d.readiness,P=computePlan(),est=estMin(P.items),R=routines().filter(x=>!x.archived);
  const seg=(k,lab,lo,hi)=>`<div class="stack"><div class="row spread small"><b>${lab}</b><span class="muted">1 ${lo} · 5 ${hi}</span></div><div class="seg">${[1,2,3,4,5].map(v=>`<button class="${r[k]===v?'on':''}" data-act="rd" data-k="${k}" data-v="${v}">${v}</button>`).join('')}</div></div>`;
  return `<h2>${d.mode==='checkin'?'How do you feel?':esc(S.routines[d.rid]?.name||'Workout')}</h2>
  ${seg('sleep','Sleep','poor','great')}${seg('energy','Energy','flat','buzzing')}${seg('stress','Stress','calm','very high')}${seg('sore','Soreness','none','very sore')}
  ${r.sore>=3?`<div class="stack"><b class="small">Where?</b><div class="mchips">${Object.entries(SORE).map(([k,[n]])=>`<button class="${d.soreAreas.includes(k)?'p1':''}" data-act="sorearea" data-k="${k}">${n}</button>`).join('')}</div></div>`:''}
  <div class="grid2"><label class="f">Time available (min)<input id="st-budget" type="number" inputmode="numeric" value="${d.budget}" data-in="budget"></label>
   <div class="stack"><span class="small" style="font-weight:600;color:var(--muted)">Gym right now</span><div class="seg">${['Quiet','Normal','Busy'].map((l,i)=>`<button class="${d.busy===i+1?'on':''}" data-act="stbusy" data-v="${i+1}">${l}</button>`).join('')}</div></div></div>
  <div class="stack"><span class="small" style="font-weight:600;color:var(--muted)">Busy or missing today (tap to swap those out)</span><div class="offchips">${Object.entries(EQ).map(([k,l])=>(cfg().gymNo||[]).includes(k)?'':`<button class="${d.off.includes(k)?'on':''}" data-act="stoff" data-k="${k}">${l}</button>`).join('')}</div></div>
  <div class="card"><div class="row spread"><label class="f grow" style="max-width:220px">Session<select id="st-day" data-in="stday"><option value="">Empty workout</option>${R.map(x=>`<option value="${x.id}" ${x.id===P.rid?'selected':''}>${esc(x.name)}${x.id===nextRoutine()?' (up next)':''}</option>`).join('')}</select></label><span class="chip ${est>d.budget?'red':'green'}">~${est} min</span></div>
   ${P.why.length?`<div class="stack">${P.why.map(t=>`<p class="small">• ${esc(t)}</p>`).join('')}</div>`:''}
   ${P.items.length?`<div class="list">${P.items.map(i=>{const sg=suggest(i.exId),X=ex(i.exId);return `<div class="li small"><span class="grow">${i.group?`<span class="ss-tag">${i.group}</span> `:''}${esc(X.n)}${i.from?`<br><span class="swapnote">instead of ${esc(ex(i.from).n)}</span>`:''}<br><span class="muted num">${i.sets} × ${sg?`${sg.w} ${unitOf(X)} × ${sg.r}`:rangeOf(X).join('–')+' reps'}</span></span><button class="sm swapbtn" data-act="planswap" data-id="${i.from||i.exId}" data-cur="${i.exId}">Swap</button></div>`}).join('')}</div>`:'<p class="muted small">Empty session. Add exercises as you go.</p>'}
   <div class="row"><button class="sm ${d.fit?'primary':''}" data-act="togglefit">Fit to time: ${d.fit?'on':'off'}</button></div></div>
  <div class="stickyfoot"><button class="primary wide" data-act="start">Start workout · ~${est} min</button></div>`}
function startWorkout(){const P=computePlan(),d=draft;

async function setupProgramme(){const have=new Map(routines().map(r=>[r.name,r]));let n=0;

function ph(it,j){const lp=lastPerf(it.exId);if(!lp){const sg=suggest(it.exId);return sg?{w:sg.w,r:sg.r}:{w:'',r:''}}const s=lp.sets[j]||lp.sets[lp.sets.length-1];return{w:s.w,r:s.r}}
function remainingMin(a){let m=0;a.items.forEach((it,i)=>{const ss=it.group&&(a.items[i-1]?.group===it.group||a.items[i+1]?.group===it.group);m+=it.sets.filter(s=>!s.done).length*(ss?1.6:2.6)});return Math.round(m)}
function vWorkout(a){const el=(Date.now()-a.start)/6e4,rem=remainingMin(a),proj=el+rem,pct=Math.min(100,el/a.budget*100);
  let h=`<div class="wkhead"><div class="row spread"><div class="grow"><h2>${esc(a.name)}</h2><div class="small muted num" id="wk-clock">${Math.floor(el)} min · ~${rem} min left · budget ${a.budget}</div></div><button class="primary" data-act="finish">Finish</button></div>

  a.items.forEach((it,i)=>{const X=ex(it.exId),sg=suggest(it.exId),u=unitOf(X);const ss=it.group&&(a.items[i-1]?.group===it.group||a.items[i+1]?.group===it.group);

function lineChart(pts,o={}){if(pts.length<2)return`<p class="muted small">Two or more entries needed for a chart.</p>`;
  const W=340,H=o.h||150,pl=38,pr=10,pt=10,pb=22;const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y).concat(o.trend?o.trend.map(p=>p.y):[]).concat(o.ref?[o.ref.y]:[]);
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x1===x0)x1=x0+DAY;let y0=Math.min(...ys),y1=Math.max(...ys);const pad=(y1-y0)*.15||1;y0-=pad;y1+=pad;
  const sx=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr),sy=y=>pt+(1-(y-y0)/(y1-y0))*(H-pt-pb);const d=o.dec??1;
  let g='';for(let i=0;i<=3;i++){const y=y0+(y1-y0)*i/3;g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${sy(y)}" y2="${sy(y)}"/><text class="ax" x="${pl-5}" y="${sy(y)+3}" text-anchor="end">${y.toFixed(d)}</text>`}
  const path=pts.map((p,i)=>(i?'L':'M')+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1)).join(' ');
  const area=path+` L${sx(pts[pts.length-1].x).toFixed(1)} ${H-pb} L${sx(pts[0].x).toFixed(1)} ${H-pb} Z`;
  const tr=o.trend?`<path class="ln2" d="${o.trend.map((p,i)=>(i?'L':'M')+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1)).join(' ')}"/>`:'';
  const dots=pts.length<=40?pts.map((p,i)=>`<circle class="dt ${i===pts.length-1?'last':''}" cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="${i===pts.length-1?4.5:3}"/>`).join(''):'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<path class="ar" d="${area}"/>${o.ref?`<line class="ln2" x1="${pl}" x2="${W-pr}" y1="${sy(o.ref.y).toFixed(1)}" y2="${sy(o.ref.y).toFixed(1)}"/><text class="ax" x="${W-pr}" y="${(sy(o.ref.y)-4).toFixed(1)}" text-anchor="end">${esc(o.ref.label)} ${o.ref.y.toFixed(d)}</text>`:''}${tr}<path class="ln" d="${path}"/>${dots}
  <text class="ax" x="${pl}" y="${H-6}">${fmtD(x0)}</text><text class="ax" x="${W-pr}" y="${H-6}" text-anchor="end">${fmtD(x1)}</text></svg>`}
function barChart(vals,target,labels){const W=340,H=130,pl=24,pr=6,pt=8,pb=20;const mx=Math.max((target||0)+1,...vals);const bw=(W-pl-pr)/vals.length;

  for(let i=0;i<=mx;i+=Math.max(1,Math.ceil(mx/4)))s+=`<text class="ax" x="${pl-6}" y="${sy(i)+3}" text-anchor="end">${i}</text>`;
  vals.forEach((v,i)=>{const x=pl+i*bw+bw*.18;s+=`<rect class="bar ${target!=null&&v<target?'lo':''}" x="${x.toFixed(1)}" y="${sy(v).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${Math.max(0,H-pb-sy(v)).toFixed(1)}" rx="3"/>`;
    if(labels[i])s+=`<text class="ax" x="${(x+bw*.32).toFixed(1)}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`});

async function compress(file){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const draw=(max,q)=>{const s=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);return{cv,q}};
  const max=1400,q=.82,c=draw(max,q),dataUrl=c.cv.toDataURL('image/jpeg',q);
  const blob=await new Promise(r=>c.cv.toBlob(r,'image/jpeg',q));return{blob,dataUrl}}finally{URL.revokeObjectURL(url)}}

function coachCalls(){const out=[],c=cfg(),now=Date.now();const wc=weekCounts(1)[0];const dleft=7-((new Date().getDay()+6)%7);
  if(wc<c.weeklyTarget)out.push(['yellow',`${wc}/${c.weeklyTarget} sessions this week with ${dleft} day${dleft>1?'s':''} left. ${c.weeklyTarget-wc>dleft?'The target is out of reach this week; do what fits and keep the streak for next week.':'Still on for the target.'}`]);
  else out.push(['green',`Weekly target hit (${wc}/${c.weeklyTarget}). Extra sessions are optional.`]);
  const H=A().hist;for(const id in H){const l=H[id][H[id].length-1];if(l.ts<now-28*DAY)continue;const sg=suggest(id);if(sg?.stall)out.push(['red',`${ex(id).n} has stalled for 3 sessions. Swap to a close variation or drop 10% and rebuild.`])}
  const av=avg4(),tw=thisWeek();const anyRecent=A().W.some(w=>w.start>now-28*DAY);
  if(anyRecent){const neg=MAJOR.filter(k=>av[k]<tgt(k)[0]*.5);if(neg.length)out.push(['red',`Under-trained over 4 weeks: ${neg.map(k=>MUS[k][0]).join(', ')}. Add 2–4 sets a week for each.`]);
    const over=Object.keys(MUS).filter(k=>tw[k]>tgt(k)[1]*1.2);if(over.length)out.push(['blue',`Above range this week: ${over.map(k=>MUS[k][0]).join(', ')}. More is not better past this point; recovery is the limit.`])}
  const wi=weighins();if(wi.length>=3){const a=wi[wi.length-3],b=wi[wi.length-1],r=(b.kg-a.kg)/((b.date-a.date)/(7*DAY)||1);out.push(['yellow',`Weight trend over the last 3 weigh-ins: ${r>0?'+':''}${r.toFixed(2)} kg/week.`])}
  const rr=A().W.filter(w=>w.readiness&&w.start>now-21*DAY);if(rr.length>=3){const m=rr.reduce((a,w)=>a+readiness(w.readiness),0)/rr.length;if(m<2.6)out.push(['red',`Readiness has averaged ${m.toFixed(1)}/5 over 3 weeks. Shorter sessions and a deload week are sensible.`])}
  return out}
function coachData(){const c=cfg(),now=Date.now(),W=A().W.filter(w=>w.start>now-28*DAY),tw=thisWeek(),av=avg4();
  const trends={};for(const id in A().hist){const h=era(id),o=peakOf(oldEra(id));if((!h.length||h[h.length-1].ts<now-42*DAY)&&!o)continue;const sg=suggest(id);trends[ex(id).n]={sessionsSinceComeback:h.length,last:h.length?`${h[h.length-1].w}x${h[h.length-1].r}`:null,bestE1RM:A().best[id]!=null?+A().best[id].toFixed(1):null,oldBest:o?`${o.w}x${o.r}`:null,pctOfOldBest:rebuildPct(id)!=null?Math.round(rebuildPct(id)):null,nextTarget:sg?`${sg.w}x${sg.r}`:null,stalled:!!sg?.stall}}
  const p=phase(),cbk=cbStart()?{since:new Date(cbStart()).toISOString().slice(0,10),week:weeksBack()+1,phase:p?.n,repsInReserve:p?.rir,context:'Returning after a long break (nearly 2 years). Numbers before the comeback date are an old peak, not current capacity. Muscle memory means strength returns faster than first built, but tendons and joints adapt slower than muscle: ramp volume gradually, avoid grinding reps, keep 2-3 reps in reserve early.'}:null;
  return JSON.stringify({today:new Date().toISOString().slice(0,10),unit:c.unit,weeklyTarget:c.weeklyTarget,sessionBudgetMin:c.budget,athleteNotes:c.coachNotes||null,
    sessionsLast28Days:W.map(w=>({date:new Date(w.start).toISOString().slice(0,10),name:w.name,minutes:w.end?Math.round((w.end-w.start)/6e4):null,readiness:w.readiness?+readiness(w.readiness).toFixed(1):null,busy:w.busy,exercises:w.items.map(it=>({ex:ex(it.exId).n,sets:it.sets.map(s=>`${s.w}x${s.r}${s.t!=='N'?'('+s.t+')':''}`).join(' ')}))})),
    hardSetsPerMuscle:Object.fromEntries(Object.keys(MUS).map(k=>[MUS[k][0],{thisWeek:+tw[k].toFixed(1),avg4wk:+av[k].toFixed(1),target:`${MUS[k][1]}-${MUS[k][2]}`}])),
    cardioLast28Days:cardioList().filter(c=>c.start>now-28*DAY).map(c=>({date:new Date(c.start).toISOString().slice(0,10),machine:c.machine,minutes:c.mins,level:c.level,effort:c.effort||null})),saunaLast28Days:saunaList().filter(c=>c.start>now-28*DAY).map(c=>({date:new Date(c.start).toISOString().slice(0,10),minutes:c.mins,rounds:c.rounds||1,tempC:c.temp||null,type:c.kind||null})),
    comeback:cbk,exerciseTrends:trends,weighIns:weighins().slice(-8).map(w=>({date:new Date(w.date).toISOString().slice(0,10),kg:w.kg,waistCm:w.waist||null})),

 discardyes:()=>{closeSheet();restEnd=0;$('#restbar').hidden=true;del('active','current');releaseWake()},
 finish:()=>openSheet(finishSheet),
 busy:b=>{S.active.current.busy=+b.dataset.v;saveActive();drawSheet()},
 savewk:()=>{restEnd=0;$('#restbar').hidden=true;saveWorkout()},
 restadd:()=>{restEnd+=30000},restskip:()=>{restEnd=Date.now()},
 viewwk:b=>{confirmId=null;openSheet(sheetViewWk,b.dataset.id)},
 confirm:b=>{confirmId=b.dataset.c;drawSheet()},unconfirm:()=>{confirmId=null;drawSheet()},
 delwk:b=>{closeSheet();del('workouts',b.dataset.id);toast('Session deleted.')},
 bview:b=>{bodyView=b.dataset.v;render(true)},
 muscle:b=>openSheet(sheetMuscle,b.dataset.m),
 weighin:()=>openSheet(sheetWeighin),
 savewi:()=>{const kg=parseFloat($('#wi-kg').value),waist=parseFloat($('#wi-waist').value),d=$('#wi-date').value;if(!(kg>20&&kg<400)){toast('Enter your weight in kg.');return}

 delwi:b=>{del('weighins',b.dataset.id);drawSheet()},
 pose:b=>{pose=b.dataset.v;selP=[];render(true)},
 addphoto:()=>{$('#photoin').value='';$('#photoin').click()},
 npose:b=>{newPhoto.pose=b.dataset.v;drawSheet()},
 savephoto:async b=>{b.disabled=true;b.textContent='Saving…';const n=newPhoto;let rec={date:Date.now(),pose:n.pose};

 selphoto:b=>{const id=b.dataset.id;selP=selP.includes(id)?selP.filter(x=>x!==id):[...selP.slice(-1),id];render(true)},
 compare:()=>{cmpVal=50;openSheet(()=>sheetCompare()+(confirmId==='ph'?`<div class="confirm"><b>Delete the newer photo?</b><div class="row"><button class="danger" data-act="delphoto">Delete</button><button data-act="unconfirm">Keep</button></div></div>`:`<button class="danger sm" data-act="confirm" data-c="ph">Delete newer photo</button>`))},
 comparefirst:()=>{const P=photos().filter(p=>p.pose===pose);selP=[P[P.length-1].id,P[0].id];render(true);ACT.compare()},
 cmpmode:b=>{cmpMode=b.dataset.v;drawSheet()},
 delphoto:async()=>{const ps=selP.map(id=>({id,...S.photos[id]})).sort((a,b)=>b.date-a.date);const p=ps[0];closeSheet();selP=[];
   del('photos',p.id);toast('Photo deleted.')},
 copyclaude:async()=>{const t=claudePrompt();try{await navigator.clipboard.writeText(t);toast('Copied. Paste it into a Claude chat.')}catch(e){const ta=$('#claude-fallback');if(ta){ta.hidden=false;ta.value=t;ta.focus();ta.select()}toast('Select all and copy the text below.')}},
 quickstart:()=>{preStart(nextRoutine(),true);startWorkout()},
 planswap:b=>openSwap({kind:'plan',exId:b.dataset.id,exclude:[b.dataset.cur],off:draft.off}),
 liveswap:b=>{const a=S.active.current,it=a.items[+b.dataset.i];openSwap({kind:'live',i:+b.dataset.i,exId:it.exId,exclude:a.items.map(x=>x.exId),off:a.off||[]})},
 swapoff:b=>{const k=b.dataset.k;swp.off=swp.off.includes(k)?swp.off.filter(x=>x!==k):[...swp.off,k];drawSheet()},
 swapnever:()=>{swp.never=!swp.never;drawSheet()},
 swapto:b=>applySwap(b.dataset.id),
 swapany:()=>{if(swp.kind==='live'){pick={q:'',m:'',for:'swap',i:swp.i}}else{pick={q:'',m:'',for:'planswap',orig:swp.exId}}openSheet(sheetPicker)},
 stoff:b=>{const k=b.dataset.k;draft.off=draft.off.includes(k)?draft.off.filter(x=>x!==k):[...draft.off,k];drawSheet()},
 gymno:async b=>{const k=b.dataset.k,c=cfg(),g=c.gymNo||[];await put('settings','main',{...c,gymNo:g.includes(k)?g.filter(x=>x!==k):[...g,k]},true);drawSheet()},
 'unavail-rm':async b=>{const c=cfg();await put('settings','main',{...c,unavail:(c.unavail||[]).filter(x=>x!==b.dataset.id)},true);drawSheet()},
 pastecode:()=>openSheet(()=>`<h2>Paste import code</h2><p class="small muted">Paste the code Claude gave you, or the contents of a backup file.</p><textarea id="paste-in" style="min-height:160px" placeholder="Paste here"></textarea><button class="primary wide" data-act="pasteimport">Import</button>`),
 pasteimport:async()=>{const t=($('#paste-in')?.value||'').trim();if(!t){toast('Paste the code first.');return}let d;try{d=decodeImport(t)}catch(e){toast('That code is incomplete. Copy it again in full.');return}await importData(d)},
 importyes:async()=>{const d=pendingImport;pendingImport=null;closeSheet();await importData(d)},
 checkin:()=>preStart(nextRoutine(),true), sorearea:b=>{const k=b.dataset.k;draft.soreAreas=draft.soreAreas.includes(k)?draft.soreAreas.filter(x=>x!==k):[...draft.soreAreas,k];drawSheet()},
 stbusy:b=>{draft.busy=+b.dataset.v;drawSheet()},
 setupprog:()=>setupProgramme(),
 newroutine:()=>editRoutine(null), editroutine:b=>editRoutine(b.dataset.id),
 rtmove:b=>{const i=+b.dataset.i,j=i+ +b.dataset.d,a=rdraft.items;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];drawSheet()},
 rtdel:b=>{rdraft.items.splice(+b.dataset.i,1);drawSheet()},
 rtsets:b=>{const it=rdraft.items[+b.dataset.i];it.sets=Math.max(1,Math.min(8,it.sets+ +b.dataset.d));drawSheet()},
 savert:async()=>{const{id,...r}=rdraft;r.name=r.name.trim();if(id&&S.routines[id]?.archived)r.archived=true;await put('routines',id||uid(),r);closeSheet();toast('Routine saved.')},
 rtarchive:async()=>{const id=rdraft.id,r={...S.routines[id]};r.archived=!r.archived;await put('routines',id,r);closeSheet();toast(r.archived?'Archived. History is kept.':'Restored.')},
 rtdelete:()=>{const id=rdraft.id;closeSheet();del('routines',id);toast('Routine deleted. Workout history is kept.')},
 savesettings:()=>{const c={...cfg()};document.querySelectorAll('[data-in="s"]').forEach(el=>{const k=el.dataset.k;c[k]=k==='comebackStart'?(el.value?new Date(el.value+'T00:00:00').getTime():null):['unit','coachNotes'].includes(k)?el.value:(+el.value||DEF[k])});closeSheet();put('settings','main',c);toast('Settings saved.')},
 export:async()=>{const data=JSON.stringify({app:'overload',v:1,exported:new Date().toISOString(),...S,active:{}});const fn=`overload-backup-${new Date().toISOString().slice(0,10)}.json`;
   const file=new File([data],fn,{type:'application/json'});let ok=false;
   try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Overload backup'});ok=true}}catch(e){if(e&&e.name==='AbortError'){toast('Backup cancelled.');return}}
   if(!ok){const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);ok=true}
   await put('settings','main',{...cfg(),lastBackup:Date.now()},true);if(sheetFn)drawSheet();render();toast('Backup saved.')},
 import:()=>{$('#importin').value='';$('#importin').click()},
};
document.addEventListener('click',e=>{unlockAudio();const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f){if(b.dataset.act!=='scrim')e.preventDefault();f(b,e)}});
document.addEventListener('input',e=>{const el=e.target,k=el.dataset.in;if(!k)return;const v=el.value;
  if(k==='w'||k==='r'){const s=S.active.current?.items[+el.dataset.i]?.sets[+el.dataset.j];if(s){s[k]=v;saveActive()}}
  else if(k==='budget'){draft.budget=+v||draft.budget}
  else if(k==='finnotes'){S.active.current.notes=v;saveActive()}
  else if(k==='rtname'){rdraft.name=v;const b=document.querySelector('[data-act="savert"]');if(b)b.disabled=!(v.trim()&&rdraft.items.length)}
  else if(k==='pickq'){pick.q=v;const l=$('#pk-list');const tmp=document.createElement('div');tmp.innerHTML=sheetPicker();l.innerHTML=tmp.querySelector('#pk-list').innerHTML}
  else if(k==='exn'){exd.n=v;const b=document.querySelector('[data-act="saveex"]');if(b)b.disabled=!(v.trim()&&Object.keys(exd.m).length)}
  else if(k==='exlo'){exd.lo=v}else if(k==='exhi'){exd.hi=v}else if(k==='exstep'){exd.step=v}
  else if(k==='cmp'){cmpVal=+v;const t=$('#cmptop'),d=$('#cmpdiv');if(cmpMode==='wipe'){t.style.clipPath=`inset(0 ${100-cmpVal}% 0 0)`;if(d)d.style.left=cmpVal+'%'}else t.style.opacity=(100-cmpVal)/100}
  else if(k==='ghost'){newPhoto.ghost=+v;const g=$('#ghost');if(g)g.style.opacity=v/100}
  else if(k==='fintime'){S.active.current.endT=v;saveActive()}
  else if(k==='cf'){cdr[el.dataset.k]=v;if(el.dataset.k==='machine'){const h=$('#cf-hint');if(h){const t=cardioHint(v);h.textContent=t;h.className='small'+(t?'':' muted')}}}
  else if(k==='sf'){sdr[el.dataset.k]=v}});
document.addEventListener('change',e=>{const el=e.target,k=el.dataset.in;if(!k)return;
  if(k==='budget')drawSheet();
  else if(k==='stday'){draft.rid=el.value||null;draft.mode='routine';draft.repl={};drawSheet()}
  else if(k==='rtgroup'){rdraft.items[+el.dataset.i].group=el.value;drawSheet()}
  else if(k==='agroup'){S.active.current.items[+el.dataset.i].group=el.value;saveActive();render(true)}
  else if(k==='pickm'){pick.m=el.value;drawSheet()}
  else if(k==='exu'){exd.u=el.value}
  else if(k==='exeq'){exd.eq=el.value}
  else if(k==='progex'){progEx=el.value;render(true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetFn)closeSheet()});
$('#photoin').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const c=await compress(f);if(newPhoto?.url&&newPhoto.url.startsWith('blob:'))URL.revokeObjectURL(newPhoto.url);
  newPhoto={blob:c.blob,dataUrl:c.dataUrl,url:URL.createObjectURL(c.blob),pose:newPhoto?.pose||pose,ghost:35};openSheet(sheetPhotoNew)}catch(err){toast('Could not read that image.')}});
async function importData(d){let n=0;
  for(const c of['routines','workouts','weighins','photos','exercises','reviews','settings','cardio','sauna']){for(const[id,v]of Object.entries(d[c]||{})){
    const val=c==='settings'&&id==='main'?{...cfg(),...v}:v;await put(c,id,val,true);n++}}
  ver++;closeSheet();render(true);toast(`Imported ${n} records.`)}
$('#importin').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;let d;try{d=JSON.parse(await f.text());if(d.app!=='overload')throw 0}catch(err){toast('That file is not an Overload backup.');return}await importData(d)});
let pendingImport=null;
function decodeImport(t){t=t.replace(/^.*#import=/,'').replace(/\s+/g,'');if(t.startsWith('{'))return checkD(JSON.parse(t));
  const b=atob(t.replace(/-/g,'+').replace(/_/g,'/')),d=JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0))));return checkD(d)}
function checkD(d){if(!d||d.app!=='overload')throw new Error('not overload');return d}
function checkHashImport(){const m=location.hash.match(/^#import=([A-Za-z0-9_\-]+)$/);if(!m)return;
  try{const b=atob(m[1].replace(/-/g,'+').replace(/_/g,'/')),d=JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0))));if(d.app!=='overload')throw 0;pendingImport=d;
    const n=['routines','workouts','weighins','photos','exercises','cardio','sauna'].reduce((a,c)=>a+Object.keys(d[c]||{}).length,0);
    openSheet(()=>`<h2>Import your data?</h2><p class="muted">This link carries ${n} records (routines, sessions, cardio and settings). They'll be saved on this phone.</p><button class="primary wide" data-act="importyes">Import</button>`)}
  catch(e){toast('That import link is damaged.')}
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}

// ================= boot =================
const APPV='1.1';
async function boot(){render(true);
  try{idb=await idbOpen();for(const[k,v]of await idbAll()){const x=k.indexOf('/'),c=k.slice(0,x),id=k.slice(x+1);if(S[c])S[c][id]=v}mode='idb'}
  catch(e){const L=lsLoad();if(L)COLLS.forEach(c=>S[c]=L[c]||{});mode='local'}
  ver++;render(true);checkHashImport();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    let had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)toast('App updated. It loads next time you open it.');had=true})}}
boot();
})();
</script>
